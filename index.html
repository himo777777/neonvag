let AC=null,muted=localStorage.getItem('nv_muted')==='1';
let musicBus=null,musicLP=null,bassLP=null,echo=null,echoFb=null;
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC&&!musicBus){
    try{
      musicBus=AC.createGain();musicBus.gain.value=muted?0:1;
      musicLP=AC.createBiquadFilter();musicLP.type='lowpass';musicLP.frequency.value=1200;
      musicBus.connect(musicLP);musicLP.connect(AC.destination);
      bassLP=AC.createBiquadFilter();bassLP.type='lowpass';bassLP.frequency.value=500;
      bassLP.connect(musicBus);
      echo=AC.createDelay(1);echo.delayTime.value=MUS.echoT;
      echoFb=AC.createGain();echoFb.gain.value=MUS.echoFb;
      echo.connect(echoFb);echoFb.connect(echo);echo.connect(musicLP);
    }catch(e){musicBus=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,v,slide){if(muted||!AC||AC.state!=='running')return;try{d=d||.09;type=type||'sine';v=v||.15;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function nz(d,v){if(muted||!AC||AC.state!=='running')return;try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
const PENT=[0,3,5,7,10,12,15,17];
/* ---------- adaptive synthwave soundtrack (A minor, Am-F-C-G, 2 bars / 32 sixteenth-steps) ----------
   Lookahead step-sequencer driven from the rAF loop. Tuning knobs live in MUS. */
const MUS={bpmMin:104,bpmMax:160,bassV:.19,leadV:.09,kickV:.2,hatV:.025,snV:.12,arpV:.035,echoT:.23,echoFb:.3,leadBase:220};
const CHORDS=[0,-4,3,-2];
const BASSP=[0,12,0,12,-4,8,-4,8,3,15,3,15,-2,10,-2,10];
const LEADP=[12,-1,7,-1,3,-1,7,-1,12,-1,7,-1,15,-1,12,-1,10,-1,7,-1,5,-1,7,-1,3,-1,2,-1,0,-1,-1,-1];
const ARPP=[0,7,12,7];
function vOsc(type,f,t,dur,v,dest,slide){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function vNoise(t,dur,v,dest){
  const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=b;g.gain.value=v;s.connect(g);g.connect(dest);s.start(t);
}
function scheduleStep(s,tt,norm){
  const ch=CHORDS[(s>>3)%4],fz=run&&run.frenzy;
  /* kick: four on the floor */
  if(s%4===0)vOsc('sine',120,tt,.13,MUS.kickV,musicBus,36);
  /* snare on 2 & 4 once the pace picks up */
  if(s%8===4&&norm>.5){vNoise(tt,.09,MUS.snV,musicBus);vOsc('triangle',180,tt,.08,.06,musicBus);}
  /* hats: offbeat 8ths, 16ths in frenzy (short + quiet — no sleigh-bell vibe) */
  if(fz?(s%2===1):(s%4===2&&norm>.15))vNoise(tt,.02,MUS.hatV,musicBus);
  /* bass: octave pump on 8ths */
  if(s%2===0)vOsc('sawtooth',55*Math.pow(2,BASSP[(s>>1)%16]/12),tt,.14,MUS.bassV,bassLP);
  /* lead hook: warm sawtooth an octave below the old chip-square */
  const L=LEADP[s%32];
  if(L>=0){
    const f=MUS.leadBase*Math.pow(2,(L+(fz?12:0))/12),v=MUS.leadV*(0.7+0.6*norm);
    vOsc('sawtooth',f,tt,.3,v,musicLP);
    vOsc('sawtooth',f,tt,.3,v*.5,echo);
  }
  /* chord arp layer in frenzy */
  if(fz)vOsc('sawtooth',110*Math.pow(2,(ch+12+ARPP[s%4])/12),tt,.09,MUS.arpV,musicBus);
  /* intensity filter, once per bar */
  if(s%16===0&&musicLP){
    const slow=run&&run.slowT>0;
    musicLP.frequency.setTargetAtTime(slow?500:900+norm*5000+(fz?2000:0),tt,.2);
  }
}
function music(){
  if(muted||!AC||!musicBus||AC.state!=='running'||state!==M.PLAY)return;
  const now=AC.currentTime;
  if(seqNextT<now-0.2)seqNextT=now+0.06;
  const norm=Math.max(0,Math.min(1,(run.sp-BASE())/(MAXS()-BASE())));
  const stepDur=60/(MUS.bpmMin+norm*(MUS.bpmMax-MUS.bpmMin))/4;
  let guard=0;
  try{
    while(seqNextT<now+0.12&&guard++<8){
      scheduleStep(seqStep%32,seqNextT,norm);
      seqNextT+=stepDur;seqStep++;
    }
  }catch(e){}
}

const BASE=()=>210*S,MAXS=()=>720*S,R=()=>9*S;
/* ---------- difficulty curve: long honeymoon, then smooth ramp, then overdrive ---------- */
const HONEY=24,RAMPT=150;
const lerp=(a,b,u)=>a+(b-a)*u;
function diff01(tt){if(tt<=HONEY)return 0;const u=Math.min(1,(tt-HONEY)/(RAMPT-HONEY));return u*u*(3-2*u);}
function deep01(tt){return Math.max(0,Math.min(1,(tt-RAMPT)/120));}
function curDiff(){
  if(mode==='level'&&curLvl)return curLvl.diff;
  return diff01(run.t);
}
function curSpeed(){
  if(mode==='level'&&curLvl)return (235+(720-235)*curLvl.diff)*S*(curLvl.spd||1);
  if(run.t<HONEY)return lerp(210,235,run.t/HONEY)*S;
  return Math.min((235+(720-235)*diff01(run.t))*S+60*S*deep01(run.t),780*S);
}

/* ---------- world: breathing procedural tunnel ---------- */
function h1(n){const s=Math.sin(n*127.1+run.seed*311.7)*43758.5453;return s-Math.floor(s);}
function walk(x){const i=Math.floor(x/620),f=x/620-i,a=h1(i)*2-1,b=h1(i+1)*2-1,u=f*f*(3-2*f);return a+(b-a)*u;}
function centerRaw(x){
  const d=curDiff(),A=.35+.65*d+(mode!=='level'?.15*deep01(run.t):0);
  return H*.5+(Math.sin(x*.0021+run.seed*7)*H*.15+Math.sin(x*.0051+run.seed*13)*H*.06+walk(x)*H*.11)*A;
}
function corridor(x){
  const d=curDiff(),dp=(mode!=='level')?deep01(run.t):0;
  let gh=(lerp(.34,.115,d)-.03*dp)*H;
  if(mode==='level'&&curLvl)gh*=(curLvl.cor||1);
  gh+=Math.sin(x*.0075+run.t*1.7)*H*.012*(.25+.75*d);
  let c=centerRaw(x);
  if(run.graceX>0&&x<run.graceX){gh=Math.max(gh,H*.2);c=c*.4+H*.3;}
  c=Math.min(Math.max(c,gh+H*.04),H-gh-H*.04);
  return{t:c-gh,b:c+gh,c:c};
}
function newRun(auto,seedO){
  run={seed:(seedO!==undefined?seedO:Math.random()*1000),x:W*.3,dist:0,py:H*.5,vy:0,hold:false,sp:BASE(),t:0,score:0,orbs:0,mult:1,maxMult:1,frenzy:false,surf:0,surfF:false,surfTot:0,inv:auto?0:1,graceX:0,revUsed:false,auto:!!auto,orbL:[],nextOrb:W*.3+420*S,trail:[],newBest:false,newDaily:false,orbSpawn:0,won:false,stars:0,puL:[],nextPu:W*.3+6000*S,pu:0,shield:false,magT:0,slowT:0};
  parts.length=0;floats.length=0;
}

/* ---------- fx helpers ---------- */
function addFloat(txt,x,y,c){floats.push({txt:txt,x:x,y:y,c:c,l:1});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.3,v=(70+Math.random()*300)*S;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.5,c:i%4===0?'#ffffff':c,r:(2+Math.random()*3)*S});}}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*S*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=42*S*dt;f.l-=dt*.9;if(f.l<=0)floats.splice(i,1);}
  shake*=Math.exp(-5*dt);
  flashT=Math.max(0,flashT-dt*2);
}

/* ---------- core gameplay step ---------- */
function step(dt){
  run.t+=dt;
  run.sp=curSpeed();
  if(run.auto){const cc=corridor(run.x+run.sp*.22);run.hold=run.py>cc.c;}
  run.x+=run.sp*dt;
  run.dist=run.x-W*.3;
  if(mode==='level'&&curLvl&&!run.auto){
    if(curLvl.type==='goal'){if(run.dist>=curLvl.target*46*S){win();return;}}
    else if(run.t>=curLvl.target){win();return;}
  }
  run.score+=run.sp*dt*.09;
  const dNow=curDiff();
  const cl=run.sp*(0.90+0.35*dNow),tg=run.hold?-cl:cl;
  run.vy+=(tg-run.vy)*Math.min(1,dt*(18+9*dNow));
  run.py+=run.vy*dt;
  if(run.py<-60)run.py=-60;
  if(run.py>H+60)run.py=H+60;
  run.trail.push({x:run.x,y:run.py});
  if(run.trail.length>42)run.trail.shift();
  if(run.frenzy&&Math.random()<.5)parts.push({x:run.x,y:run.py+(Math.random()*2-1)*14*S,vx:-run.sp*.6,vy:(Math.random()*2-1)*60*S,l:.4,c:'hsl('+(Math.random()*360)+',100%,65%)',r:2*S});

  /* orbs */
  while(run.nextOrb<run.x+W+80){
    const wx=run.nextOrb,cc=corridor(wx),off=(h1(wx*.013)*2-1)*(cc.b-cc.t)*.16;
    run.orbL.push({x:wx,y:cc.c+off,got:false,p:Math.random()*6.3});
    if(mode==='level'&&curLvl){
      const endX=curLvl.type==='goal'?W*.3+curLvl.target*46*S:W*.3+run.sp*curLvl.target;
      if(wx<=endX)run.orbSpawn++;
    }
    run.nextOrb+=(340+h1(wx*.017)*260)*S;
  }
  /* power-ups (seeded -> deterministic per track; none in auto/menu demo) */
  if(!run.auto){
    while(run.nextPu<run.x+W+80){
      const wx=run.nextPu,cc=corridor(wx),r=h1(wx*.029);
      run.puL.push({x:wx,y:cc.c,kind:r<.4?0:(r<.75?1:2),got:false,p:Math.random()*6.3});
      run.nextPu+=(9000+h1(wx*.041)*5000)*S;
    }
    for(let i=run.puL.length-1;i>=0;i--){
      const o=run.puL[i];
      if(o.x<run.x-W*.6){run.puL.splice(i,1);continue;}
      if(o.got)continue;
      if(Math.hypot(o.x-run.x,o.y-run.py)<40*S){
        o.got=true;run.pu++;
        if(o.kind===0){run.shield=true;addFloat(t('puShield'),W*.3,o.y-34*S,'#22e5ff');tone(660,.15,'triangle',.18);tone(990,.2,'sine',.1);burst(o.x,o.y,'#22e5ff',14);trackEvent('powerup',{kind:'shield'});}
        else if(o.kind===1){run.magT=8;addFloat(t('puMagnet'),W*.3,o.y-34*S,'#ff2ea6');tone(440,.18,'sawtooth',.12,440);burst(o.x,o.y,'#ff2ea6',14);trackEvent('powerup',{kind:'magnet'});}
        else{run.slowT=5;addFloat(t('puSlow'),W*.3,o.y-34*S,'#ffd23f');tone(880,.25,'sine',.14,-440);burst(o.x,o.y,'#ffd23f',14);trackEvent('powerup',{kind:'slow'});}
        if(navigator.vibrate)navigator.vibrate(12);
        if(run.pu>=3)unlockAch('pu3');
      }
    }
    if(run.magT>0)run.magT=Math.max(0,run.magT-dt);
  }
  for(let i=0;i<run.orbL.length;i++){
    const o=run.orbL[i];
    if(o.x<run.x-90*S){
      if(!o.got){if(!run.auto&&run.mult>1){run.mult--;addFloat('×'+run.mult,W*.3,run.py-46*S,'#8a92c9');}o.got=true;}
      if(o.x<run.x-W*.6){run.orbL.splice(i,1);i--;}
      continue;
    }
    if(o.got)continue;
    const dx=o.x-run.x,dy=o.y-run.py,d=Math.hypot(dx,dy);
    const magR=(run.magT>0?320:130)*S;
    if(d<magR&&dx>-40){const k=Math.min(1,(run.magT>0?16:12)*dt);o.x+=(run.x-o.x)*k;o.y+=(run.py-o.y)*k;}
    if(d<30*S){
      o.got=true;run.orbs++;
      const pts=25*run.mult;run.score+=pts;
      run.mult=Math.min(8,run.mult+1);
      run.maxMult=Math.max(run.maxMult,run.mult);
      if(run.mult>=8&&!run.frenzy){
        run.frenzy=true;shake=Math.max(shake,6*S);
        addFloat(t('frenzy'),W*.5,H*.3,'#ffd23f');
        tone(880,.1,'square',.12);tone(1320,.16,'square',.1);
        unlockAch('mult8');
      }
      if(run.orbs>=10)unlockAch('orb10');
      if(run.mult<8)run.frenzy=false;
      const f=440*Math.pow(2,PENT[run.mult-1]/12);
      tone(f,.12,'triangle',.18);tone(f*2,.08,'sine',.07);
      if(!run.auto&&navigator.vibrate)navigator.vibrate(8);
      burst(o.x,o.y,'#ffd23f',12);
      if(!run.auto)addFloat('+'+pts,W*.3,o.y-30*S,'#ffd23f');
    }
  }

  /* edge surf (near-miss bonus) */
  const c0=corridor(run.x),dTop=run.py-c0.t,dBot=c0.b-run.py,near=Math.min(dTop,dBot);
  if(!run.auto&&near<38*S&&near>R()+2){
    run.surf+=dt;run.surfTot+=dt;run.score+=240*run.mult*dt;
    if(run.surfTot>=3)unlockAch('surf3');
    if(Math.random()<.6)parts.push({x:run.x-8*S,y:dTop<dBot?c0.t:c0.b,vx:-run.sp*.4,vy:(Math.random()*2-1)*140*S,l:.5,c:'#ff2ea6',r:2.5*S});
    if(run.surf>.5&&!run.surfF){run.surfF=true;addFloat(t('surf'),W*.5,H*.2,'#ff2ea6');tone(700,.14,'sawtooth',.1,180);}
  }else{
    run.surf=Math.max(0,run.surf-dt*2);
    if(run.surf<.2)run.surfF=false;
  }

  /* collision */
  if(run.inv>0)run.inv-=dt;
  else{
    let hit=false;const rr=R();
    for(let k=-1;k<=1;k++){
      const cc=corridor(run.x+k*rr*.8);
      if(run.py-rr<cc.t||run.py+rr>cc.b){hit=true;break;}
    }
    if(hit){
      if(run.auto){const cc=corridor(run.x);run.py=cc.c;run.vy=0;run.inv=1.4;run.x+=500*S;}
      else if(run.shield){
        run.shield=false;
        const cc=corridor(run.x);run.py=cc.c;run.vy=0;
        run.inv=1.2;shake=8*S;flashT=.3;
        burst(run.x,run.py,'#22e5ff',30);
        nz(.2,.3);tone(220,.3,'sawtooth',.2,-120);
        addFloat(t('puShieldUsed'),W*.5,H*.35,'#22e5ff');
        if(navigator.vibrate)navigator.vibrate([30,30,30]);
        unlockAch('shieldSave');trackEvent('shield_save',{});
      }
      else die();
    }
  }
  if(!run.auto&&run.dist/(46*S)>=1000)unlockAch('dist1000');
}

function die(){
  state=M.DIE;dieT=0;shake=15*S;timeScale=.22;
  nz(.45,.5);tone(140,.5,'sawtooth',.25,-90);
  if(musicLP&&AC)try{musicLP.frequency.setTargetAtTime(120,AC.currentTime,.08);}catch(e){}
  if(navigator.vibrate)navigator.vibrate([50,40,90]);
  burst(run.x,run.py,skin().a,46);
  hide($('hint'));
  const sc=Math.floor(run.score);
  if(mode!=='level'&&sc>hi){hi=sc;localStorage.setItem('nv_hi',''+hi);run.newBest=true;}
  if(mode==='daily'){const db=getDailyBest();if(sc>db){localStorage.setItem('nv_d'+DAY,''+sc);run.newDaily=true;}}
  if(mode==='level'){run.newBest=saveLevelBest(curLvlIdx,sc)&&sc>0;trackEvent('level_fail',{level:curLvlIdx});}
  unlockAch('firstFlight');
  if(sc>=2500)unlockAch('score2500');
}

function calcStars(){
  const frac=run.orbs/Math.max(1,run.orbSpawn);
  let s=1;if(frac>=curLvl.s2)s=2;if(frac>=curLvl.s3)s=3;return s;
}
function win(){
  state=M.WIN;dieT=0;timeScale=.5;
  run.won=true;run.stars=calcStars();
  saveLevelStars(curLvlIdx,run.stars);
  run.newBest=saveLevelBest(curLvlIdx,Math.floor(run.score));
  /* celebration: fireworks ABOVE/AHEAD of the ship (never on it — must not read as a crash), no shake */
  const cols=['#ffd23f','#22e5ff','#ff2ea6','#b6ff2e','#ffffff'];
  for(let i=0;i<5;i++)burst(run.x+(i-1)*70*S,Math.max(60*S,run.py-H*.22-(i%2)*H*.1),cols[i],22);
  addFloat(t('lvlDone'),W*.5,H*.3,'#ffd23f');
  /* victory fanfare: ascending A-major arpeggio + closing chord */
  try{
    if(ac()&&musicLP){
      const t0=AC.currentTime,F=[440,554.37,659.25,880];
      F.forEach((f,i)=>vOsc('triangle',f,t0+i*.11,.22,.2,musicLP));
      vOsc('triangle',880,t0+.48,.55,.16,musicLP);
      vOsc('sine',1318.5,t0+.48,.55,.1,musicLP);
      vOsc('sine',1760,t0+.48,.5,.06,musicLP);
    }else{tone(660,.12,'triangle',.16);tone(880,.12,'triangle',.14);tone(1320,.2,'sine',.12);}
  }catch(e){tone(660,.12,'triangle',.16);tone(880,.12,'triangle',.14);}
  if(navigator.vibrate)navigator.vibrate([20,30,20]);
  hide($('hint'));
  trackEvent('level_complete',{level:curLvlIdx,stars:run.stars});
  if(curLvlIdx===4)unlockAch('level5');
}

    curLvl=null;

}

function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

function drawWalls(camX){
  const step=14,top=[],bot=[];
  for(let sx=-28;sx<=W+28;sx+=step){const cc=corridor(sx+camX);top.push([sx,cc.t]);bot.push([sx,cc.b]);}
  ctx.fillStyle='#0b1033';
  ctx.beginPath();ctx.moveTo(-40,-80);for(const p of top)ctx.lineTo(p[0],p[1]);ctx.lineTo(W+40,-80);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-40,H+80);for(const p of bot)ctx.lineTo(p[0],p[1]);ctx.lineTo(W+40,H+80);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(90,110,220,.10)';ctx.lineWidth=1;
  for(let k=1;k<=2;k++){
    ctx.beginPath();for(let i=0;i<top.length;i++){const p=top[i];if(i)ctx.lineTo(p[0],p[1]-26*S*k);else ctx.moveTo(p[0],p[1]-26*S*k);}ctx.stroke();
    ctx.beginPath();for(let i=0;i<bot.length;i++){const p=bot[i];if(i)ctx.lineTo(p[0],p[1]+26*S*k);else ctx.moveTo(p[0],p[1]+26*S*k);}ctx.stroke();
  }
  const g=ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#ff2ea6');g.addColorStop(.5,'#7a5cff');g.addColorStop(1,'#22e5ff');
  ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=g;
  const passes=[[8,.10],[4,.35],[1.8,1]];
  for(const pp of passes){
    ctx.globalAlpha=pp[1];ctx.lineWidth=pp[0]*S;
    ctx.beginPath();for(let i=0;i<top.length;i++){if(i)ctx.lineTo(top[i][0],top[i][1]);else ctx.moveTo(top[i][0],top[i][1]);}ctx.stroke();
    ctx.beginPath();for(let i=0;i<bot.length;i++){if(i)ctx.lineTo(bot[i][0],bot[i][1]);else ctx.moveTo(bot[i][0],bot[i][1]);}ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawOrbs(camX){
  const tt=run.t;
  for(const o of run.orbL){
    if(o.got)continue;
    const sx=o.x-camX;
    if(sx<-40||sx>W+40)continue;
    const r=10*S*(1+.18*Math.sin(tt*5+o.p));
    const g=ctx.createRadialGradient(sx,o.y,0,sx,o.y,r*2.6);
    g.addColorStop(0,'rgba(255,210,63,.9)');g.addColorStop(.35,'rgba(255,210,63,.45)');g.addColorStop(1,'rgba(255,210,63,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,o.y,r*2.6,0,6.3);ctx.fill();
    ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(sx,o.y,r*.55,0,6.3);ctx.fill();
  }
}

function drawFinish(camX){
  if(mode!=='level'||!curLvl||curLvl.type!=='goal'||!run)return;
  const wx=W*.3+curLvl.target*46*S,sx=wx-camX;
  if(sx<-80||sx>W+160)return;
  const cc=corridor(wx);
  ctx.save();
  /* gold glow band */
  ctx.globalAlpha=.28;ctx.fillStyle='#ffd23f';
  ctx.fillRect(sx-12*S,cc.t,24*S,cc.b-cc.t);
  /* checkered post */
  ctx.globalAlpha=.95;
  const seg=14*S;let k=0;
  for(let y=cc.t;y<cc.b;y+=seg,k++){
    ctx.fillStyle=k%2?'#ffd23f':'#ffffff';
    ctx.fillRect(sx-3.5*S,y,7*S,Math.min(seg,cc.b-y));
  }
  /* label above the line */
  ctx.globalAlpha=1;ctx.textAlign='center';
  ctx.font='900 '+Math.round(16*S)+'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle='#ffd23f';ctx.shadowColor='#ffd23f';ctx.shadowBlur=14*S;
  ctx.fillText(t('goalLbl'),sx,cc.t-10*S);
  ctx.shadowBlur=0;
  ctx.restore();
}
function drawPU(x,y,kind,r){
  if(kind===0){ /* shield: cyan double ring */
    ctx.strokeStyle='#22e5ff';ctx.lineWidth=2.5*S;
    ctx.beginPath();ctx.arc(x,y,r*.7,0,6.3);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*1.1,0,6.3);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2.4*S,0,6.3);ctx.fill();
  }else if(kind===1){ /* magnet: magenta horseshoe */
    ctx.strokeStyle='#ff2ea6';ctx.lineWidth=5*S;
    ctx.beginPath();ctx.arc(x,y,r*.8,Math.PI*.7,Math.PI*2.3);ctx.stroke();
    ctx.fillStyle='#fff';
    const tx=Math.cos(Math.PI*.7)*r*.8,ty=Math.sin(Math.PI*.7)*r*.8;
    ctx.fillRect(x+tx-2*S,y+ty-2*S,4*S,4*S);
    const ux=Math.cos(Math.PI*2.3)*r*.8,uy=Math.sin(Math.PI*2.3)*r*.8;
    ctx.fillRect(x+ux-2*S,y+uy-2*S,4*S,4*S);
  }else{ /* slow-mo: gold hourglass */
    ctx.fillStyle='#ffd23f';
    ctx.beginPath();ctx.moveTo(x-r*.6,y-r*.8);ctx.lineTo(x+r*.6,y-r*.8);ctx.lineTo(x,y);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x-r*.6,y+r*.8);ctx.lineTo(x+r*.6,y+r*.8);ctx.lineTo(x,y);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.2*S;
    ctx.beginPath();ctx.moveTo(x-r*.3,y);ctx.lineTo(x+r*.3,y);ctx.stroke();
  }
}
function drawPUs(camX){
  if(!run||!run.puL)return;
  const cols=['#22e5ff','#ff2ea6','#ffd23f'];
  for(const o of run.puL){
    if(o.got)continue;
    const sx=o.x-camX;
    if(sx<-50||sx>W+50)continue;
    const r=13*S*(1+.18*Math.sin(run.t*5+o.p));
    const g=ctx.createRadialGradient(sx,o.y,0,sx,o.y,r*2.4);
    g.addColorStop(0,hexA(cols[o.kind],.55));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,o.y,r*2.4,0,6.3);ctx.fill();
    drawPU(sx,o.y,o.kind,r);
  }
}

function drawTrail(camX){
  const tr=run.trail,n=tr.length;
  if(n<2)return;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<n;i++){
      const a=i/n;
      ctx.strokeStyle=pass?'#ffffff':(run.frenzy?'hsl('+((run.t*420+i*10)%360)+',100%,62%)':skin().a);
      ctx.globalAlpha=(pass?.75:.5)*a*a;
      ctx.lineWidth=(pass?2.2:7)*S*a;
      ctx.beginPath();
      ctx.moveTo(tr[i-1].x-camX,tr[i-1].y);
      ctx.lineTo(tr[i].x-camX,tr[i].y);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const x=W*.3,y=run.py;
  ctx.save();
  if(run.inv>0&&Math.floor(run.t*14)%2===0)ctx.globalAlpha=.3;
  const g=ctx.createRadialGradient(x,y,0,x,y,30*S);
  g.addColorStop(0,hexA(skin().a,.55));g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,30*S,0,6.3);ctx.fill();
  ctx.translate(x,y);
  ctx.rotate(Math.atan2(run.vy,run.sp));
  ctx.fillStyle=skin().a;
  ctx.beginPath();
  ctx.moveTo(15*S,0);ctx.lineTo(-10*S,9*S);ctx.lineTo(-5*S,0);ctx.lineTo(-10*S,-9*S);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(2*S,0,3.4*S,0,6.3);ctx.fill();
  ctx.restore();
}

function drawParts(camX){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.l*1.6));
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x-camX,p.y,p.r,0,6.3);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFloats(){
  ctx.textAlign='center';
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,f.l);
    ctx.font='800 '+Math.round(20*S)+'px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle=f.c;
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  const st=SAFE_TOP();
  ctx.textAlign='center';
  ctx.font='900 '+Math.round(46*S)+'px "Segoe UI",system-ui,sans-serif';
  ctx.shadowColor='rgba(34,229,255,.8)';ctx.shadowBlur=18*S;
  ctx.fillStyle='#fff';
  ctx.fillText(Math.floor(run.score),W/2,st+62*S);
  ctx.shadowBlur=0;
  if(run.mult>1){
    ctx.textAlign='left';
    ctx.font='900 '+Math.round(26*S)+'px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle=skin().a;
    ctx.fillText('×'+run.mult,16*S,st+44*S);
  }
  ctx.textAlign='right';
  ctx.font='700 '+Math.round(13*S)+'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillText(mode==='level'&&curLvl?t('lvlN')(curLvlIdx+1):t('best')+' '+(run.auto?hi:Math.max(hi,Math.floor(run.score))),W-16*S,st+40*S);
  if(mode==='level'&&curLvl){
    ctx.textAlign='center';
    ctx.font='800 '+Math.round(15*S)+'px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle='rgba(255,255,255,.8)';
    const prog=curLvl.type==='goal'
      ?Math.min(Math.floor(run.dist/(46*S)),curLvl.target)+' / '+curLvl.target+' m'
      :Math.max(0,Math.ceil(curLvl.target-run.t))+' s';
    ctx.fillText(prog,W/2,st+96*S);
  }
  /* active power-up indicators, left column */
  let py0=st+70*S;
  if(run.shield){drawPU(26*S,py0,0,9*S);py0+=26*S;}
  if(run.magT>0){drawPU(26*S,py0,1,9*S);ctx.fillStyle='rgba(255,46,166,.35)';ctx.fillRect(42*S,py0-3*S,34*S,5*S);ctx.fillStyle='#ff2ea6';ctx.fillRect(42*S,py0-3*S,34*S*run.magT/8,5*S);py0+=26*S;}
  if(run.slowT>0){drawPU(26*S,py0,2,9*S);ctx.fillStyle='rgba(255,210,63,.35)';ctx.fillRect(42*S,py0-3*S,34*S,5*S);ctx.fillStyle='#ffd23f';ctx.fillRect(42*S,py0-3*S,34*S*run.slowT/5,5*S);}
  ctx.textAlign='center';
}

function render(){
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  const camX=run?run.x-W*.3:0;
  const tt=run?run.t:0;
  for(const st of stars){
    let sx=(st.x*W-camX*st.z)%(W+40);
    if(sx<-20)sx+=W+40;
    ctx.globalAlpha=.2+.3*Math.abs(Math.sin(tt*1.5+st.x*9));
    ctx.fillStyle='#9fb4ff';
    ctx.fillRect(sx,st.y*H,st.r,st.r);
  }
  ctx.globalAlpha=1;
  ctx.save();
  if(shake>.3)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  if(run){
    const ag=ctx.createRadialGradient(W*.3,run.py,0,W*.3,run.py,H*.5);
    ag.addColorStop(0,'rgba(70,60,160,.18)');ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.fillRect(0,0,W,H);
    drawWalls(camX);
    drawFinish(camX);
    drawOrbs(camX);
    drawPUs(camX);
    drawTrail(camX);
    if(state!==M.DIE&&state!==M.OVER)drawPlayer();
    drawParts(camX);
    drawFloats();
  }
  ctx.restore();
  if(flashT>0){ctx.globalAlpha=Math.min(1,flashT*1.2);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(state===M.PLAY||state===M.DIE||state===M.PAUSE||state===M.WIN)drawHUD();
}

/* ---------- share card (viral loop) ---------- */
function shareCard(sc){
  const c=document.createElement('canvas');c.width=900;c.height=1200;
  const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,0,1200);
  bg.addColorStop(0,'#0a1030');bg.addColorStop(1,'#05060f');
  g.fillStyle=bg;g.fillRect(0,0,900,1200);
  g.strokeStyle='rgba(122,92,255,.55)';g.lineWidth=3;
  g.beginPath();for(let x=0;x<=900;x+=12){const y=600+Math.sin(x*.012)*140+Math.sin(x*.03)*40;if(x)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();
  g.beginPath();for(let x=0;x<=900;x+=12){const y=1000+Math.sin(x*.012)*140+Math.sin(x*.03)*40;if(x)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();
  g.strokeStyle=skin().a;g.lineWidth=10;g.lineCap='round';
  g.beginPath();for(let x=0;x<=900;x+=12){const y=800+Math.sin(x*.012)*140+Math.sin(x*.03)*40;if(x)g.lineTo(x,y);else g.moveTo(x,y);}g.stroke();
  g.textAlign='center';
  g.fillStyle=skin().a;g.font='900 100px "Segoe UI",system-ui,sans-serif';
  g.shadowColor=skin().a;g.shadowBlur=50;
  g.fillText('NEONVÅG',450,220);
  g.shadowBlur=0;
  g.fillStyle='#fff';g.font='900 250px "Segoe UI",system-ui,sans-serif';
  g.fillText(''+sc,450,540);
  g.fillStyle='rgba(255,255,255,.65)';g.font='700 44px "Segoe UI",system-ui,sans-serif';
  g.fillText(t('scoreLbl'),450,615);
  g.fillStyle='#ffd23f';g.font='800 46px "Segoe UI",system-ui,sans-serif';
  g.fillText(t('tag'),450,1100);
  g.fillStyle='#22e5ff';g.font='700 40px "Segoe UI",system-ui,sans-serif';
  g.shadowColor='#22e5ff';g.shadowBlur=24;
  g.fillText(PLAY_URL_SHORT,450,1164);
  g.shadowBlur=0;
  return c;
}

async function shareScore(){
  const sc=Math.floor(run.score);
  /* PLAY_URL is ALWAYS part of the share text, incl. when a file is attached —
     several Android targets drop a separate url: member on file shares. */
  const txt=(mode==='daily'?t('shareTD')(sc,dayStr()):t('shareT')(sc))+'\n'+PLAY_URL;
  trackEvent('share_attempt',{mode:mode,score:sc});
  let card=null;
  try{card=shareCard(sc);}catch(e){}
  /* 1) native share with image */
  if(card&&navigator.canShare){
    try{
      const blob=await new Promise(r=>card.toBlob(r,'image/png'));
      const file=new File([blob],'neonvag.png',{type:'image/png'});
      if(blob&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file],text:txt,title:'NEONVÅG'});
        toast(t('shShared'));trackEvent('share_success',{kind:'file'});
        return;
      }
    }catch(e){
      if(e&&e.name==='AbortError'){toast(t('shCancel'));return;}
    }
  }
  /* 2) native share, text + URL only */
  if(navigator.share){
    try{
      await navigator.share({text:txt,title:'NEONVÅG'});
      toast(t('shShared'));trackEvent('share_success',{kind:'text'});
      return;
    }catch(e){
      if(e&&e.name==='AbortError'){toast(t('shCancel'));return;}
    }
  }
  /* 3) fallback: download card + copy full text incl. URL */
  if(card){
    try{
      const a=document.createElement('a');
      a.href=card.toDataURL('image/png');a.download='neonvag-rekord.png';a.click();
    }catch(e){}
  }
  try{
    await navigator.clipboard.writeText(txt);
    toast(t('shCopied'));trackEvent('share_fallback',{kind:card?'copy+card':'copy'});
  }catch(e){
    toast(t('shFail'));trackEvent('share_fallback',{kind:'failed'});
  }
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  let rdt=(now-last)/1000;last=now;
  if(rdt>1/30)rdt=1/30;
  let dt=rdt;
  if(state===M.DIE||state===M.WIN){timeScale=Math.min(1,timeScale+rdt*1.1);dt=rdt*timeScale;}
  else if(state!==M.OVER)timeScale=1;
  if(state===M.PLAY&&run&&run.slowT>0){run.slowT=Math.max(0,run.slowT-rdt);dt=rdt*.55;}
  if(state===M.PLAY||state===M.MENU)step(dt);
  if(state===M.PLAY)music();
  if(state===M.DIE){dieT+=dt;if(dieT>.55)showOver();}
  if(state===M.WIN){dieT+=dt;if(dieT>.7)showOver();}
  if(state===M.AD){
    adT-=dt;
    $('adCount').textContent=Math.max(0,Math.ceil(adT));
    $('adBar').style.width=Math.max(0,adT/3*100)+'%';
    if(adT<=0)endAd();
  }
  updateFx(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
newRun(true);
validateSkin();
applyStrings();
refreshDots();
if(!AD_DEMO)hide($('btnRevive'));
show($('menu'));
/* first visit with analytics configured: ask before anything is ever sent */
if(ANALYTICS_CONFIG.key&&consent===null)openPrivacy();
requestAnimationFrame(loop);

/* direct links: #play = jump straight in, #auto = watch the AI play */
const Q=(location.search+location.hash).toLowerCase();
if(Q.indexOf('auto')>-1){startGame();run.auto=true;}
else if(Q.indexOf('play')>-1){startGame();}
